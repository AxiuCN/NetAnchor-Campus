name: Release

# 打 vX.Y.Z 标签时构建安装包并创建 GitHub Release；
# 手动触发只构建、上传 artifact，不建 Release（用于验证流水线）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建安装包
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 发布前测试
        run: python -m pytest -ra

      - name: 校验标签与版本一致
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $ver = (Select-String -Path src/netanchor/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($tag -ne $ver) {
            throw "标签 $tag 与 src/netanchor/__init__.py 的版本 $ver 不一致"
          }
          Write-Host "版本一致: $ver"

      - name: 安装 Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: 构建安装包
        shell: pwsh
        run: ./build/make_installer.ps1

      - name: 上传构建产物
        uses: actions/upload-artifact@v6
        with:
          name: netanchor-installer
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
          retention-days: 14

      - name: 生成发布说明
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          # 正文由 CHANGELOG 当前版本段生成，发布前可在 GitHub 上手动修改
          $ver = (Select-String -Path src/netanchor/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $lines = Get-Content CHANGELOG.md
          $head = $lines | Select-String -Pattern "^#\s+$([regex]::Escape($ver))\s*$" | Select-Object -First 1
          if (-not $head) {
            throw "CHANGELOG.md 里找不到 # $ver 一节，先补更新记录"
          }
          $next = $lines | Select-String -Pattern '^#\s+' |
            Where-Object { $_.LineNumber -gt $head.LineNumber } | Select-Object -First 1
          $body = if ($next) {
            $lines[$head.LineNumber..($next.LineNumber - 2)]
          } else {
            $lines[$head.LineNumber..($lines.Count - 1)]
          }

          # 发布说明是给用户看的，纯文档条目没有信息量
          $meaningful = @($body | Where-Object { $_ -notmatch '^- 文档：' })
          if ($meaningful.Count -eq 0) { $meaningful = $body }
          $bodyText = ($meaningful -join "`n").Trim()

          # 单引号 here-string：保留 markdown 反引号原样
          $footer = @'

          ### 安装方式

          下载 `NetAnchor-Campus-<VER>-setup.exe`，以管理员身份运行并按向导完成安装。

          - 支持 Windows 10 1607 及以上版本（x64）。
          - 支持覆盖升级与正常卸载；卸载时默认保留配置与日志。
          - 安装包未签名，SmartScreen 可能提示未知发布者。

          ### 文件校验

          请使用随附的 `SHA256SUMS.txt` 校验安装包完整性。
          '@
          $footer = $footer.Replace('<VER>', $ver)

          $doc = "### 本次变更`n`n" + $bodyText + "`n" + $footer
          $doc | Set-Content -Path release-notes.md -Encoding utf8
          Write-Host "发布说明已生成（$($meaningful.Count) 条变更）"

      - name: 创建 Release（草稿）
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Select-String -Path src/netanchor/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          gh release create $env:GITHUB_REF_NAME `
            "dist/installer/NetAnchor-Campus-$ver-setup.exe" `
            "dist/installer/SHA256SUMS.txt" `
            --title "NetAnchor-Campus $ver" `
            --notes-file release-notes.md `
            --draft