[project]
name = "netanchor-campus"
version = "0.2.1"
description = "校园网 Dr.COM 断网自动重连（Windows 服务 + 托盘）"
requires-python = ">=3.10"
dependencies = [
    "ddddocr>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pywin32>=312",
    "pyinstaller>=6.22",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
